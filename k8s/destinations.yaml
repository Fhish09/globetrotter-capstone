apiVersion: apps/v1
kind: Deployment
metadata:
  name: destinations
  namespace: globetrotter
  labels:
    app: destinations
spec:
  replicas: 2
  selector:
    matchLabels:
      app: destinations
  template:
    metadata:
      labels:
        app: destinations
    spec:
      containers:
        - name: destinations
          image: globetrotter/destinations:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: globetrotter-config
                  key: REDIS_URL
            - name: CACHE_TTL
              valueFrom:
                configMapKeyRef:
                  name: globetrotter-config
                  key: CACHE_TTL
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: destinations
  namespace: globetrotter
spec:
  selector:
    app: destinations
  ports:
    - port: 5002
      targetPort: 5002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: destinations-hpa
  namespace: globetrotter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: destinations
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
