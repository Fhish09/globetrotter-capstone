apiVersion: apps/v1
kind: Deployment
metadata:
  name: itineraries
  namespace: globetrotter
  labels:
    app: itineraries
spec:
  replicas: 2
  selector:
    matchLabels:
      app: itineraries
  template:
    metadata:
      labels:
        app: itineraries
    spec:
      containers:
        - name: itineraries
          image: globetrotter/itineraries:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
          env:
            - name: PORT
              value: "5004"
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: globetrotter-config
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: itineraries-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: itineraries
  namespace: globetrotter
spec:
  selector:
    app: itineraries
  ports:
    - port: 5004
      targetPort: 5004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: itineraries-hpa
  namespace: globetrotter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: itineraries
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
