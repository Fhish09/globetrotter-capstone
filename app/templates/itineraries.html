{% extends "base.html" %}
{% block title %}My Trips{% endblock %}
{% block content %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-12">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
    <div>
      <h1 class="heading text-2xl sm:text-4xl font-bold text-gt-text mb-1">My trips</h1>
      <p class="text-gt-muted text-sm">Saved day plans and itineraries</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <a href="/day-plan" class="gt-btn-primary px-5 py-2.5 rounded-full font-medium text-sm">
        <i class="fas fa-route mr-1"></i> Day plan builder
      </a>
      <button type="button" onclick="openCreateModal()" class="px-5 py-2.5 rounded-full font-medium text-sm border border-gt-border text-gt-muted hover:border-gt-accent hover:text-gt-accent">
        <i class="fas fa-plus mr-1"></i> New trip
      </button>
    </div>
  </div>
  <div id="status" class="mb-6"></div>
  <div id="trips" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
</section>

<div id="createModal" class="fixed inset-0 bg-black/60 hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
  <div class="bg-gt-surface border border-gt-border rounded-t-3xl sm:rounded-3xl p-6 sm:p-8 max-w-lg w-full max-h-[95vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-gt-text">Create itinerary</h2>
      <button type="button" onclick="closeCreateModal()" class="text-gt-muted"><i class="fas fa-times"></i></button>
    </div>
    <div id="createError" class="hidden mb-4 bg-red-500/10 text-red-400 text-sm px-4 py-3 rounded-xl"></div>
    <form onsubmit="event.preventDefault(); createTrip();" class="space-y-4">
      <div>
        <label class="block text-sm text-gt-muted mb-1">Title *</label>
        <input id="tripTitle" required class="w-full rounded-xl px-4 py-3 border border-gt-border" placeholder="e.g. Weekend in Douala">
      </div>
      <div>
        <label class="block text-sm text-gt-muted mb-1">Sites</label>
        <input id="tripDests" class="w-full rounded-xl px-4 py-3 border border-gt-border" placeholder="La Pagode, Youpwe, Akwa">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-gt-muted mb-1">Start</label>
          <input type="date" id="startDate" class="w-full rounded-xl px-4 py-3 border border-gt-border">
        </div>
        <div>
          <label class="block text-sm text-gt-muted mb-1">End</label>
          <input type="date" id="endDate" class="w-full rounded-xl px-4 py-3 border border-gt-border">
        </div>
      </div>
      <button id="createBtn" type="submit" class="w-full gt-btn-primary py-3 rounded-full font-semibold">Create trip</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function openCreateModal() {
  if (!localStorage.getItem('token')) { openLogin(); return; }
  document.getElementById('createModal').classList.remove('hidden');
  document.getElementById('createModal').classList.add('flex');
}
function closeCreateModal() {
  document.getElementById('createModal').classList.add('hidden');
  document.getElementById('createModal').classList.remove('flex');
}
function shareExperience(title) {
  var text = 'I planned “' + title + '” with GlobeTrotter Douala!';
  if (navigator.share) navigator.share({ title: 'My trip', text: text }).catch(function(){});
  else { try { navigator.clipboard.writeText(text); alert('Copied!'); } catch(e) { alert(text); } }
}
function rebook(dests) {
  var q = (dests && dests[0]) || '';
  if (q) localStorage.setItem('lastSearch', q);
  window.location.href = q ? ('/destinations?q=' + encodeURIComponent(q)) : '/day-plan';
}
function formatFcfa(n) {
  if (n == null) return '';
  return Number(n).toLocaleString('fr-FR') + ' FCFA';
}

async function loadTrips() {
  var token = localStorage.getItem('token');
  var status = document.getElementById('status');
  var container = document.getElementById('trips');
  if (!token) {
    status.innerHTML = '<div class="bg-gt-surface border border-gt-border rounded-2xl p-8 text-center">' +
      '<p class="font-semibold mb-2">Login to see your trips</p>' +
      '<p class="text-sm text-gt-muted mb-4">Or build a day plan without saving</p>' +
      '<a href="/day-plan" class="gt-btn-primary px-5 py-2.5 rounded-full inline-block mr-2">Day plan</a>' +
      '<button onclick="openLogin()" class="px-5 py-2.5 rounded-full border border-gt-border text-gt-muted">Login</button></div>';
    container.innerHTML = '';
    return;
  }
  status.innerHTML = '<p class="text-gt-muted"><i class="fas fa-spinner fa-spin"></i> Loading…</p>';
  try {
    var res = await fetch('/itineraries', {
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
    });
    var data = await res.json();
    if (!res.ok) {
      status.innerHTML = '<p class="text-red-400">' + (data.error || 'Error') + '</p>';
      return;
    }
    status.innerHTML = '';
    if (!data.length) {
      container.innerHTML = '<div class="col-span-full text-center py-12 text-gt-muted">' +
        '<p class="mb-4">No trips yet.</p>' +
        '<a href="/day-plan" class="gt-btn-primary px-5 py-2.5 rounded-full inline-block">Build a day plan</a></div>';
      return;
    }
    container.innerHTML = data.map(function(trip) {
      var dests = trip.destinations || [];
      var chips = dests.map(function(d) {
        return '<span class="gt-chip text-xs px-3 py-1 rounded-full">' + d + '</span>';
      }).join('');
      var slots = trip.slots || {};
      var slotLine = '';
      if (slots.morning || slots.lunch || slots.evening) {
        slotLine = '<p class="text-xs text-gt-muted mb-2">' +
          [slots.morning && ('☀ ' + slots.morning),
           slots.lunch && ('🍽 ' + slots.lunch),
           slots.evening && ('🌙 ' + slots.evening)].filter(Boolean).join(' → ') +
          '</p>';
      }
      var total = trip.total_fcfa != null
        ? '<p class="text-gt-accent font-semibold text-sm mb-3">' + formatFcfa(trip.total_fcfa) + '</p>'
        : '';
      var destsJson = JSON.stringify(dests);
      var titleJson = JSON.stringify(trip.title || '');
      return '<article class="bg-gt-surface border border-gt-border rounded-2xl p-6 gt-card-glow">' +
        '<h2 class="text-lg font-bold text-gt-text mb-1">' + (trip.title || 'Trip') + '</h2>' +
        '<p class="text-sm text-gt-muted mb-2"><i class="far fa-calendar mr-1"></i> ' +
        (trip.start_date || '—') + (trip.end_date ? ' → ' + trip.end_date : '') + '</p>' +
        slotLine + total +
        '<div class="flex flex-wrap gap-2 mb-4">' + chips + '</div>' +
        '<div class="flex flex-wrap gap-2">' +
        '<button type="button" class="text-sm px-4 py-2 rounded-full border border-gt-border text-gt-muted hover:border-gt-accent hover:text-gt-accent" ' +
        'onclick=\'shareExperience(' + titleJson + ')\'><i class="fas fa-share-alt mr-1"></i> Share</button>' +
        '<button type="button" class="text-sm px-4 py-2 rounded-full gt-btn-primary" ' +
        'onclick=\'rebook(' + destsJson + ')\'><i class="fas fa-redo mr-1"></i> Rebook</button>' +
        '</div></article>';
    }).join('');
  } catch (e) {
    status.innerHTML = '<p class="text-red-400">Network error</p>';
  }
}

async function createTrip() {
  var token = localStorage.getItem('token');
  if (!token) { openLogin(); return; }
  var title = document.getElementById('tripTitle').value.trim();
  var dests = document.getElementById('tripDests').value.split(',').map(function(d) { return d.trim(); }).filter(Boolean);
  var start = document.getElementById('startDate').value;
  var end = document.getElementById('endDate').value;
  var errorEl = document.getElementById('createError');
  var btn = document.getElementById('createBtn');
  if (!title) { errorEl.textContent = 'Title required'; errorEl.classList.remove('hidden'); return; }
  btn.disabled = true;
  errorEl.classList.add('hidden');
  try {
    var res = await fetch('/itineraries', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/json'
      },
      body: JSON.stringify({ title: title, destinations: dests, start_date: start, end_date: end })
    });
    var data = await res.json();
    if (res.ok) {
      closeCreateModal();
      loadTrips();
    } else {
      errorEl.textContent = data.error || 'Failed';
      errorEl.classList.remove('hidden');
    }
  } catch (e) {
    errorEl.textContent = 'Network error';
    errorEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
  }
}

loadTrips();
</script>
{% endblock %}
