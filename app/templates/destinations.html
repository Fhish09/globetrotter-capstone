{% extends "base.html" %}

{% block title %}Destinations{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto px-6 py-12">
    <div class="mb-10">
        <h1 class="heading text-4xl font-bold text-gray-900 mb-2">Explore Destinations</h1>
        <p class="text-gray-500">Find your next adventure</p>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-2xl shadow-sm p-6 mb-10 flex flex-wrap gap-4 items-end">
        <div class="flex-1 min-w-[200px]">
            <label class="block text-sm font-medium text-gray-700 mb-1">Search</label>
            <input type="text" id="searchQ" placeholder="City, country..." class="w-full border border-gray-200 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="w-40">
            <label class="block text-sm font-medium text-gray-700 mb-1">Tag</label>
            <select id="tagFilter" class="w-full border border-gray-200 rounded-xl px-4 py-2.5">
                <option value="">All</option>
                <option value="beach">Beach</option>
                <option value="food">Food</option>
                <option value="culture">Culture</option>
                <option value="nature">Nature</option>
                <option value="adventure">Adventure</option>
            </select>
        </div>
        <div class="w-40">
            <label class="block text-sm font-medium text-gray-700 mb-1">Max Cost / day</label>
            <input type="number" id="maxCost" placeholder="e.g. 100" class="w-full border border-gray-200 rounded-xl px-4 py-2.5">
        </div>
        <button onclick="applyFilters()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl hover:bg-indigo-700 transition font-medium">
            Apply Filters
        </button>
    </div>

    <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-20 text-gray-400">
            <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
            <p>Loading...</p>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
async function loadResults(params = '') {
    const res = await fetch('/destinations' + params);
    const data = await res.json();
    const container = document.getElementById('results');

    if (!data.length) {
        container.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400">
            <i class="fas fa-map text-5xl mb-4"></i>
            <p class="text-lg">No destinations match your filters</p>
        </div>`;
        return;
    }

    container.innerHTML = data.map(dest => `
        <div class="bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-xl transition">
            <img src="https://picsum.photos/seed/${dest.name}/600/400" class="w-full h-52 object-cover" alt="${dest.name}">
            <div class="p-6">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-xl font-bold text-gray-900">${dest.name}</h3>
                    <span class="text-emerald-600 font-semibold">$${dest.avg_cost_per_day || '—'}</span>
                </div>
                <p class="text-sm text-gray-500 mb-3">${dest.country || ''} ${dest.continent ? '• ' + dest.continent : ''}</p>
                <p class="text-gray-600 text-sm mb-4 line-clamp-2">${dest.description || ''}</p>
                <div class="flex flex-wrap gap-2">
                    ${(dest.tags || []).map(t => `<span class="bg-gray-100 text-gray-700 text-xs px-2.5 py-1 rounded-full">${t}</span>`).join('')}
                </div>
            </div>
        </div>
    `).join('');
}

function applyFilters() {
    const q = document.getElementById('searchQ').value;
    const tag = document.getElementById('tagFilter').value;
    const max = document.getElementById('maxCost').value;

    let params = [];
    if (q) params.push(`q=${encodeURIComponent(q)}`);
    if (tag) params.push(`tag=${tag}`);
    if (max) params.push(`max_cost=${max}`);

    loadResults(params.length ? '?' + params.join('&') : '');
}

// Load with URL params if present
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.toString()) {
    if (urlParams.get('q')) document.getElementById('searchQ').value = urlParams.get('q');
    loadResults('?' + urlParams.toString());
} else {
    loadResults();
}
</script>
{% endblock %}
