version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: globetrotter_db
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: globetrotter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d globetrotter"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  globetrotter:
    build: .
    container_name: globetrotter_app
    ports:
      - "5000:5000"
    volumes:
      - .:/globetrotter
    environment:
      - PORT=5000
      - FLASK_DEBUG=1
      - FLASK_APP=app.main:app
      - SECRET_KEY=dev-secret-key-please-change-in-prod
      - DATABASE_URL=postgresql://globetrotter:globetrotter@db:5432/globetrotter
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=5000 --debug --reload
    stdin_open: true
    tty: true

volumes:
  postgres_data:
