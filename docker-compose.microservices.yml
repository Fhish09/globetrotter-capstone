version: "3.9"

# Phase 2 – Microservices stack
# Usage: docker-compose -f docker-compose.microservices.yml up --build

services:
  db:
    image: postgres:15-alpine
    container_name: gt_db
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: globetrotter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d globetrotter"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: gt_auth
    environment:
      - PORT=5001
      - SECRET_KEY=dev-secret-key-please-change-in-prod
      - DATABASE_URL=postgresql://globetrotter:globetrotter@db:5432/globetrotter
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  destinations:
    build:
      context: .
      dockerfile: services/destinations/Dockerfile
    container_name: gt_destinations
    environment:
      - PORT=5002
    restart: unless-stopped

  recommendations:
    build:
      context: .
      dockerfile: services/recommendations/Dockerfile
    container_name: gt_recommendations
    environment:
      - PORT=5003
      - SECRET_KEY=dev-secret-key-please-change-in-prod
      - AUTH_SERVICE_URL=http://auth:5001
      - DESTINATIONS_SERVICE_URL=http://destinations:5002
    depends_on:
      - auth
      - destinations
    restart: unless-stopped

  itineraries:
    build:
      context: .
      dockerfile: services/itineraries/Dockerfile
    container_name: gt_itineraries
    environment:
      - PORT=5004
      - SECRET_KEY=dev-secret-key-please-change-in-prod
      - DATABASE_URL=postgresql://globetrotter:globetrotter@db:5432/globetrotter
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gt_gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth:5001
      - DESTINATIONS_SERVICE_URL=http://destinations:5002
      - RECOMMENDATIONS_SERVICE_URL=http://recommendations:5003
      - ITINERARIES_SERVICE_URL=http://itineraries:5004
    depends_on:
      - auth
      - destinations
      - recommendations
      - itineraries
    restart: unless-stopped

volumes:
  postgres_data:
