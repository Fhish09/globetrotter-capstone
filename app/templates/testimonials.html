{% extends "base.html" %}
{% block title %}Traveler Stories{% endblock %}
{% block content %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-14">
  <h1 class="heading text-3xl sm:text-4xl font-bold text-gt-text mb-2">Traveler stories</h1>
  <p class="text-gt-muted mb-10">Recent experiences from visitors in Douala (demo for the capstone).</p>
  <div id="allStories" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
</section>
{% endblock %}
{% block scripts %}
<script>
const DEFAULT_AVATAR = "{{ url_for('static', filename='img/avatar-default.svg') }}";
const STORIES = [
  { name: "Amina N.", place: "La Pagode", text: "Standing in front of La Pagode in Bonanjo was the highlight of our Douala city walk." },
  { name: "Jean-Paul T.", place: "Musée Maritime", text: "The port and maritime history of Douala made the city click for us." },
  { name: "Marie K.", place: "Nouvelle Liberté", text: "The metal sculpture at Deido is unforgettable. Go early to avoid traffic." },
  { name: "Carlos M.", place: "Akwa", text: "Evening in Akwa: food, music, and the energy of the economic capital." },
  { name: "Fatima S.", place: "Youpwe", text: "Fresh fish by the waterfront — a real taste of working Douala." },
  { name: "David O.", place: "Bonanjo", text: "A full morning walking Bonanjo monuments is the best first-day plan." },
  { name: "Grace E.", place: "Port", text: "Watching boats at the port gave a real sense of Douala’s pulse." },
  { name: "Ibrahim B.", place: "Marché Mboppi", text: "Intense, colourful, very Douala. Keep bags in front and go with a list." },
];
document.getElementById('allStories').innerHTML = STORIES.map(s => `
  <article class="bg-white border border-gt-border rounded-2xl p-6 flex gap-4 gt-card-glow">
    <img src="${DEFAULT_AVATAR}" alt="" class="w-14 h-14 rounded-full object-cover shrink-0 border border-gt-border bg-[#dfe5e7]" width="56" height="56">
    <div>
      <h2 class="font-semibold text-gt-text">${s.name}</h2>
      <p class="text-xs text-gt-accent mb-2">${s.place}</p>
      <p class="text-gt-muted text-sm leading-relaxed">${s.text}</p>
    </div>
  </article>
`).join('');
</script>
{% endblock %}
