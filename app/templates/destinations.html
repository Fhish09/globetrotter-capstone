{% extends "base.html" %}

{% block title %}Destinations{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-12" aria-labelledby="dest-heading">
    <div class="mb-6 sm:mb-10">
        <h1 id="dest-heading" class="heading text-2xl sm:text-3xl md:text-4xl font-bold text-gray-900 mb-1 sm:mb-2">Explore Destinations</h1>
        <p class="text-gray-500 text-sm sm:text-base">Find your next adventure</p>
    </div>

    <!-- Filters respond to container width via @container -->
    <div class="cq-filters-container bg-white rounded-2xl shadow-sm p-4 sm:p-6 mb-8 sm:mb-10">
        <form onsubmit="event.preventDefault(); applyFilters();" class="cq-filters" role="search">
            <div class="cq-filter-search">
                <label for="searchQ" class="block text-sm font-medium text-gray-700 mb-1">Search</label>
                <input type="search" id="searchQ" placeholder="City, country..."
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 text-base focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                       autocomplete="off">
            </div>
            <div class="cq-filter-field">
                <label for="tagFilter" class="block text-sm font-medium text-gray-700 mb-1">Tag</label>
                <select id="tagFilter" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-base">
                    <option value="">All</option>
                    <option value="beach">Beach</option>
                    <option value="food">Food</option>
                    <option value="culture">Culture</option>
                    <option value="nature">Nature</option>
                    <option value="adventure">Adventure</option>
                </select>
            </div>
            <div class="cq-filter-field">
                <label for="maxCost" class="block text-sm font-medium text-gray-700 mb-1">Max Cost / day</label>
                <input type="number" id="maxCost" placeholder="e.g. 100" min="0" max="1000"
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 text-base">
            </div>
            <button id="filterBtn" type="submit" class="cq-filter-btn bg-indigo-600 text-white px-6 py-3 rounded-xl hover:bg-indigo-700 transition font-medium flex items-center justify-center gap-2 min-h-[48px]">
                <span>Apply Filters</span>
            </button>
        </form>
    </div>

    <div class="cq-grid-container">
        <div id="results" class="cq-grid" role="list" aria-live="polite">
            <div style="grid-column:1/-1" class="text-center py-16 sm:py-20 text-gray-400">
                <i class="fas fa-spinner fa-spin text-3xl sm:text-4xl mb-4" aria-hidden="true"></i>
                <p>Loading...</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
function getDestImage(dest) {
    return dest.image || `https://picsum.photos/seed/${encodeURIComponent(dest.name)}/600/400`;
}

async function loadResults(params = '') {
    const btn = document.getElementById('filterBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Loading...';

    try {
        const res = await fetch('/destinations' + params);
        const data = await res.json();
        const container = document.getElementById('results');

        if (!data.length) {
            container.innerHTML = `<div style="grid-column:1/-1" class="text-center py-16 text-gray-400">
                <i class="fas fa-map text-4xl mb-4" aria-hidden="true"></i>
                <p class="text-base sm:text-lg">No destinations match your filters</p>
            </div>`;
            return;
        }

        container.innerHTML = data.map(dest => `
            <a href="/destinations/${dest.id}" class="cq-card bg-white rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition block group" role="listitem">
                <div class="cq-card-media relative overflow-hidden">
                    <img src="${getDestImage(dest)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${dest.name}" loading="lazy">
                </div>
                <div class="cq-card-body">
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <h2 class="cq-card-title font-bold text-gray-900 group-hover:text-indigo-600 transition">${dest.name}</h2>
                        <span class="text-emerald-600 font-semibold text-sm shrink-0">$${dest.avg_cost_per_day || '—'}</span>
                    </div>
                    <p class="text-xs text-gray-500 mb-2 truncate">${dest.country || ''} ${dest.continent ? '• ' + dest.continent : ''}</p>
                    <p class="text-gray-600 text-sm mb-3 line-clamp-2">${dest.description || ''}</p>
                    <div class="flex flex-wrap gap-1.5">
                        ${(dest.tags || []).slice(0,4).map(t => `<span class="bg-gray-100 text-gray-700 text-xs px-2.5 py-1 rounded-full">${t}</span>`).join('')}
                    </div>
                </div>
            </a>
        `).join('');
    } catch (e) {
        document.getElementById('results').innerHTML = `<div style="grid-column:1/-1" class="text-center py-16 text-red-400"><p>Failed to load destinations</p></div>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Apply Filters</span>';
    }
}

function applyFilters() {
    const q = document.getElementById('searchQ').value.trim();
    const tag = document.getElementById('tagFilter').value;
    const max = document.getElementById('maxCost').value;
    let params = [];
    if (q) params.push(`q=${encodeURIComponent(q)}`);
    if (tag) params.push(`tag=${tag}`);
    if (max) params.push(`max_cost=${max}`);
    loadResults(params.length ? '?' + params.join('&') : '');
}

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.toString()) {
    if (urlParams.get('q')) document.getElementById('searchQ').value = urlParams.get('q');
    loadResults('?' + urlParams.toString());
} else {
    loadResults();
}
</script>
{% endblock %}
