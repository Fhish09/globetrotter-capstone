apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations
  namespace: globetrotter
  labels:
    app: recommendations
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendations
  template:
    metadata:
      labels:
        app: recommendations
    spec:
      containers:
        - name: recommendations
          image: globetrotter/recommendations:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          env:
            - name: PORT
              value: "5003"
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: globetrotter-config
                  key: SECRET_KEY
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: globetrotter-config
                  key: AUTH_SERVICE_URL
            - name: DESTINATIONS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: globetrotter-config
                  key: DESTINATIONS_SERVICE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: globetrotter-config
                  key: REDIS_URL
            - name: CACHE_TTL
              value: "60"
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: recommendations
  namespace: globetrotter
spec:
  selector:
    app: recommendations
  ports:
    - port: 5003
      targetPort: 5003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recommendations-hpa
  namespace: globetrotter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recommendations
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
