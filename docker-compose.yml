version: "3.9"

services:
  globetrotter:
    build: .
    container_name: globetrotter_app
    ports:
      - "5000:5000"
    volumes:
      - .:/globetrotter
    environment:
      - PORT=5000
      - FLASK_DEBUG=1
      - SECRET_KEY=dev-secret-key-please-change-in-prod
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=5000 --debug --reload
    stdin_open: true
    tty: true