{% extends "base.html" %}
{% block title %}Destination{% endblock %}
{% block content %}
<section class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <div id="loading" class="text-center py-20 text-gt-muted" role="status">
        <i class="fas fa-spinner fa-spin text-4xl mb-4"></i><p>Loading...</p>
    </div>
    <div id="content" class="hidden">
        <a href="/destinations" class="inline-flex items-center gap-2 text-gt-accent hover:underline mb-8 font-medium">
            <i class="fas fa-arrow-left"></i> Back to sites
        </a>
        <div class="relative rounded-3xl overflow-hidden border border-gt-border shadow-xl mb-10 h-72 md:h-96">
            <img id="destImage" src="" alt="" class="w-full h-full object-cover">
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-gt-bg to-transparent p-6 md:p-8">
                <h1 id="destName" class="heading text-3xl md:text-5xl font-bold text-gt-text"></h1>
                <p id="destLocation" class="text-gt-muted mt-2 text-lg"></p>
            </div>
        </div>
        <div class="grid md:grid-cols-3 gap-8">
            <div class="md:col-span-2 space-y-6">
                <div>
                    <h2 class="text-xl font-bold text-gt-text mb-3">About</h2>
                    <p id="destDescription" class="text-gt-muted leading-relaxed"></p>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gt-text mb-3">Local tips</h2>
                    <div id="destTips" class="space-y-3"></div>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gt-text mb-3">Tags</h2>
                    <div id="destTags" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
            <div class="space-y-4">
                <div class="bg-gt-surface border border-gt-border rounded-2xl p-6">
                    <p class="text-sm text-gt-muted mb-1">Typical budget</p>
                    <p id="destCost" class="text-2xl font-bold text-gt-accent"></p>
                    <p id="destCostNote" class="text-xs text-gt-muted mt-2"></p>
                </div>
                <div class="bg-gt-surface border border-gt-border rounded-2xl p-6">
                    <p class="text-sm text-gt-muted mb-1">District</p>
                    <p id="destDistrict" class="text-lg font-semibold text-gt-text"></p>
                </div>
                <a href="/day-plan" class="block w-full text-center gt-btn-primary py-3.5 rounded-xl font-semibold min-h-[48px]">
                    <i class="fas fa-route mr-2"></i> Add to day plan
                </a>
            </div>
        </div>
    </div>
    <div id="error" class="hidden text-center py-20" role="alert">
        <i class="fas fa-exclamation-circle text-5xl text-red-400 mb-4"></i>
        <p class="text-gt-muted text-lg">Site not found</p>
        <a href="/destinations" class="text-gt-accent mt-4 inline-block hover:underline">Back to all sites</a>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
const destId = {{ dest_id }};
function formatFcfa(n) {
    if (n == null || n === '') return '—';
    return Number(n).toLocaleString('fr-FR') + ' FCFA';
}
function getDestImage(dest) {
    return dest.image || `https://commons.wikimedia.org/wiki/Special:FilePath/Pagode_de_Douala_01.JPG?width=1200`;
}
function renderTips(tips) {
    if (!tips) {
        document.getElementById('destTips').innerHTML = '<p class="text-gt-muted text-sm">No tips yet.</p>';
        return;
    }
    const rows = [
        { key: 'hours', icon: 'fa-clock', label: 'Hours' },
        { key: 'transport', icon: 'fa-motorcycle', label: 'Moto / taxi' },
        { key: 'timing', icon: 'fa-sun', label: 'Best time' },
        { key: 'safety', icon: 'fa-shield-alt', label: 'Safety' },
    ];
    document.getElementById('destTips').innerHTML = rows.filter(r => tips[r.key]).map(r => `
      <div class="bg-gt-surface border border-gt-border rounded-xl p-4 flex gap-3">
        <span class="text-gt-accent mt-0.5"><i class="fas ${r.icon}"></i></span>
        <div>
          <p class="text-xs uppercase tracking-wide text-gt-accent mb-1">${r.label}</p>
          <p class="text-sm text-gt-muted leading-relaxed">${tips[r.key]}</p>
        </div>
      </div>
    `).join('');
}
async function loadDestination() {
    try {
        const res = await fetch('/destinations', { headers: { 'Accept': 'application/json' } });
        const data = await res.json();
        const dest = data.find(d => d.id === destId);
        if (!dest) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            return;
        }
        document.title = dest.name + ' - GlobeTrotter';
        document.getElementById('destImage').src = getDestImage(dest);
        document.getElementById('destImage').alt = dest.name;
        document.getElementById('destName').textContent = dest.name;
        document.getElementById('destLocation').textContent = (dest.district ? dest.district + ' · ' : '') + 'Douala, Cameroon';
        document.getElementById('destDescription').textContent = dest.description || 'No description available.';
        document.getElementById('destCost').textContent = formatFcfa(dest.avg_cost_per_day);
        document.getElementById('destCostNote').textContent = dest.cost_note || 'Prices in FCFA';
        document.getElementById('destDistrict').textContent = dest.district || 'Douala';
        document.getElementById('destTags').innerHTML = (dest.tags || []).map(t =>
            `<span class="gt-chip px-3 py-1.5 rounded-full text-sm font-medium">${t}</span>`
        ).join('');
        renderTips(dest.tips);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        window.currentDest = dest;
    } catch (e) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
    }
}
loadDestination();
</script>
{% endblock %}
