{% extends "base.html" %}
{% block title %}Destinations{% endblock %}
{% block content %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <div class="mb-6 sm:mb-10">
        <h1 class="heading text-2xl sm:text-3xl md:text-4xl font-bold text-gt-text mb-1">Explore Douala</h1>
        <p class="text-gt-muted text-sm sm:text-base">Tourist sites — prices in FCFA</p>
    </div>
    <div class="cq-filters-container bg-gt-surface border border-gt-border rounded-2xl p-4 sm:p-6 mb-8">
        <form onsubmit="event.preventDefault(); applyFilters();" class="cq-filters" role="search">
            <div class="cq-filter-search">
                <label for="searchQ" class="block text-sm font-medium text-gt-muted mb-1">Search</label>
                <input type="search" id="searchQ" placeholder="Pagode, Bonanjo, museum…" class="w-full rounded-xl px-4 py-3 text-base border border-gt-border bg-gt-surface2" autocomplete="off">
            </div>
            <div class="cq-filter-field">
                <label for="tagFilter" class="block text-sm font-medium text-gt-muted mb-1">Tag</label>
                <select id="tagFilter" class="w-full rounded-xl px-4 py-3 text-base border border-gt-border bg-gt-surface2">
                    <option value="">All</option>
                    <option value="history">History</option>
                    <option value="culture">Culture</option>
                    <option value="art">Art</option>
                    <option value="food">Food</option>
                    <option value="museum">Museum</option>
                    <option value="city">City</option>
                </select>
            </div>
            <div class="cq-filter-field">
                <label for="maxCost" class="block text-sm font-medium text-gt-muted mb-1">Max budget (FCFA)</label>
                <input type="number" id="maxCost" placeholder="e.g. 10000" min="0" max="100000" step="500" class="w-full rounded-xl px-4 py-3 text-base border border-gt-border bg-gt-surface2">
            </div>
            <button id="filterBtn" type="submit" class="cq-filter-btn gt-btn-primary px-6 py-3 rounded-xl font-medium min-h-[48px]"><span>Apply Filters</span></button>
        </form>
    </div>
    <div class="cq-grid-container">
        <div id="results" class="cq-grid" role="list" aria-live="polite">
            <div style="grid-column:1/-1" class="text-center py-16 text-gt-muted"><i class="fas fa-spinner fa-spin text-3xl mb-4"></i><p>Loading...</p></div>
        </div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
function formatFcfa(n) {
    if (n == null || n === '') return '—';
    return Number(n).toLocaleString('fr-FR') + ' FCFA';
}
function getDestImage(dest) {
    return dest.image || `https://commons.wikimedia.org/wiki/Special:FilePath/Pagode_de_Douala_01.JPG?width=600`;
}
async function loadResults(params = '') {
    const btn = document.getElementById('filterBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
    try {
        const res = await fetch('/destinations' + params, { headers: { 'Accept': 'application/json' } });
        const data = await res.json();
        const container = document.getElementById('results');
        if (!Array.isArray(data) || !data.length) {
            container.innerHTML = `<div style="grid-column:1/-1" class="text-center py-16 text-gt-muted"><p>No sites match your filters</p></div>`;
            return;
        }
        container.innerHTML = data.map(dest => `
            <a href="/destinations/${dest.id}" class="cq-card bg-gt-surface border border-gt-border rounded-2xl overflow-hidden hover:border-gt-accent/40 transition block group" role="listitem">
                <div class="cq-card-media relative overflow-hidden">
                    <img src="${getDestImage(dest)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${dest.name}" loading="lazy">
                </div>
                <div class="cq-card-body">
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <h2 class="cq-card-title font-bold text-gt-text group-hover:text-gt-accent transition">${dest.name}</h2>
                        <span class="text-gt-accent font-semibold text-xs sm:text-sm shrink-0 whitespace-nowrap">${formatFcfa(dest.avg_cost_per_day)}</span>
                    </div>
                    <p class="text-xs text-gt-muted mb-2 truncate">${dest.district || ''} · Douala</p>
                    <p class="text-gt-muted text-sm mb-3 line-clamp-2">${dest.description || ''}</p>
                    <div class="flex flex-wrap gap-1.5">
                        ${(dest.tags || []).slice(0,4).map(t => `<span class="gt-chip text-xs px-2.5 py-1 rounded-full">${t}</span>`).join('')}
                    </div>
                </div>
            </a>`).join('');
    } catch (e) {
        document.getElementById('results').innerHTML = `<div style="grid-column:1/-1" class="text-center py-16 text-red-400"><p>Failed to load</p></div>`;
    } finally {
        btn.disabled = false; btn.innerHTML = '<span>Apply Filters</span>';
    }
}
function applyFilters() {
    const q = document.getElementById('searchQ').value.trim();
    const tag = document.getElementById('tagFilter').value;
    const max = document.getElementById('maxCost').value;
    let params = [];
    if (q) params.push(`q=${encodeURIComponent(q)}`);
    if (tag) params.push(`tag=${tag}`);
    if (max) params.push(`max_cost=${max}`);
    loadResults(params.length ? '?' + params.join('&') : '');
}
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.toString()) {
    if (urlParams.get('q')) document.getElementById('searchQ').value = urlParams.get('q');
    loadResults('?' + urlParams.toString());
} else loadResults();
</script>
{% endblock %}
